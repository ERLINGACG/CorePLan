plugins {
    id 'java'

}

group = 'com.erling'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':Service-J')
    implementation project(':Pojo-J')
    implementation project(':Service-Kt')
    implementation 'junit:junit:4.12'
    implementation project(':Util-J')
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    testImplementation project(':Start')
}
bootJar {
    mainClass = 'com.erling.Application' // 替换为你的主类全限定名
}
test {
    useJUnitPlatform()
}
kotlin {
    jvmToolchain(21)
}