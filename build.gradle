import org.springframework.boot.gradle.plugin.SpringBootPlugin

buildscript {
    ext.kotlin_version = '2.1.20'
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0' // 不应用到根项目
    //历史版本:3.2.0
    id 'io.spring.dependency-management' version '1.1.4'
}
apply plugin: 'kotlin'


allprojects {
    group = 'com.erling'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}
ext {
    springAiVersion = "1.0.0-RC1"
}
// 为子模块配置公共依赖
subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'org.springframework.boot' // 子模块单独应用Spring Boot插件

    dependencyManagement {
        imports {
            mavenBom "org.springframework.ai:spring-ai-bom:$springAiVersion"
            mavenBom SpringBootPlugin.BOM_COORDINATES
        }
    }

    // 公共测试依赖
    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test' // 测试依赖
    }
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-actuator' // 监控和管理
        implementation 'org.springframework.boot:spring-boot-starter-web' //Spring Web
        implementation 'com.mysql:mysql-connector-j'       // MySQL数据库驱动
        implementation 'org.projectlombok:lombok'          // 简化对象创建过程
        annotationProcessor 'org.projectlombok:lombok'     // 缺失的关键配置
        implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4' // MyBatis框架

        implementation 'com.github.penggle:kaptcha:2.3.2' // 验证码

        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
        implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
        implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

        implementation 'org.springframework.integration:spring-integration-mqtt'
        implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
        implementation 'org.springframework.boot:spring-boot-starter-websocket' // WebSocket支持


    }
    dependencies {


    }
    dependencies {
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0' // 升级openAPI到3.0.0
    }

    dependencies { //针对跨语言（C++）
        implementation 'net.java.dev.jna:jna:5.8.0' //
    }
    dependencies { //openAI
        implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    }

    test {
        useJUnitPlatform()
    }
}
repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/snapshot' }
    maven { url 'https://repo.spring.io/milestone' } // 新增里程碑仓库
    // 如果仍找不到，添加JCenter备用仓库
    maven { url 'https://jitpack.io' }
    maven {

        url "https://repo.bytedeco.org/repository/maven-public/"

    }
}
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
}

bootJar {
    mainClass = 'com.erling.Application' // 替换为你的主类全限定名
}

kotlin {
    jvmToolchain(21)
}