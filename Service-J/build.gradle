plugins {
    id 'java'

}

group = 'com.erling'
version = '0.0.1-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {

    implementation project(':Pojo-J')
    implementation project(':Dao-J')
    implementation project(':Util-J')


//    implementation 'org.testng:testng:6.9.6'
    implementation 'org.junit.jupiter:junit-jupiter:5.8.1'
    implementation project(':Native-J')

    testImplementation project(':Pojo-J')
    testImplementation project(':Dao-J')
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    testImplementation project(':Start')
}

test {
    useJUnitPlatform()
}
bootJar {
    mainClass = 'com.erling.Application' // 替换为你的主类全限定名
}